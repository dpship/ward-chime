services:
  - type: web
    name: ward-chime-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ward-chime-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: ward-chime-db
    plan: free
    region: singapore
