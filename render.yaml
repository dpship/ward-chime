services:
  - type: web
    name: ward-chime-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ward-chime-db
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: static_site
    name: ward-chime-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ward-chime-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    customDomains:
      - app.rmshospitals.org

databases:
  - name: ward-chime-db
    plan: free
    region: singapore
